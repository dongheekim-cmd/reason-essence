<title>이성 유감 | 이성과 본질</title>
<meta name="description" content="인류는 이성의 힘으로 우주의 법칙을 발견하고 세계를 이해하는 놀라운 성취를 이루었다. 그런데 왜 우리는 일상의 판단과 사회적 갈등 앞에서 그토록 비이성적인가. 증거보다 자기편을, 원칙보다 이익을 앞세우는 사회에서 이성의 상실은 결국 도덕성의 붕괴로 이어진다. 인간 이성의 위대한 성취를 되돌아보며, 현대 대한민국 사회의 집단적 편향과 물질주의, 정치적 이중 기준을 비판하고 이성과 도덕의 회복을 묻는다.">
